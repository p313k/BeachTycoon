}

// --- Neu starten ---
function resetGame() {
  if (!window.confirm('Wirklich neu starten? Der ganze Spielstand geht verloren!')) return;
  state.money = 0;
  state.day = 1;
  state.season = 1;
  state.seasonStartMoney = 0;
  state.dayStartTime = Date.now();
  state.staff = 0;
  state.eismaenner = 0;
  state.boote = 0;
  state.pool = false;
  state.clubhaus = false;
  state.bar = false;
  state.loungerUpgrades = defaultUpgrades(START_LOUNGER_COUNT);
  clearSave(SAVE_KEY); // löscht auch ein altes Cookie, sonst käme der Spielstand zurück
  saveState();
  location.reload();
}

function buyUpgrade(index, kind) {
  const u = state.loungerUpgrades[index];
  if (u[kind]) return;
  const cost = UPGRADES[kind].cost;
  if (state.money < cost) return;
  state.money -= cost;
  u[kind] = true;
  saveState();
}

function nextStaffCost() {
  return Math.round(STAFF_COST_BASE * Math.pow(STAFF_COST_GROWTH, state.staff));
}

function buyStaff() {
  if (state.staff >= MAX_STAFF) return;
  const cost = nextStaffCost();
  if (state.money < cost) return;
  state.money -= cost;
  state.staff += 1;
  ensureStaffFigures();
  saveState();
}

// --- Eingabe ---
hud.addEventListener('pointerdown', (e) => {
  const rect = hud.getBoundingClientRect();
  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;

  // Season-Abrechnung: Button für die nächste Season
  if (dayEnded) {
    if (pointInRect(px, py, getNextDayButtonRect())) startNextDay();
    return;
  }

  if (pointInRect(px, py, getResetButtonRect())) {
    resetGame();
    return;
  }

  if (pointInRect(px, py, getViewButtonRect())) {
    state.view = istEgoSicht() ? 'ueber' : 'ego';
    saveState();
    return;
  }

  if (selectedLounger !== null) {
    if (pointInRect(px, py, getUpgradeButtonRect('close'))) {
      selectedLounger = null;
      return;
    }
    for (const kind of UPGRADE_KEYS) {
      if (pointInRect(px, py, getUpgradeButtonRect(kind))) {
        buyUpgrade(selectedLounger, kind);
        return;
      }
    }
  } else {
    if (pointInRect(px, py, getPersonalButtonRect())) {
      buyStaff();
      return;
    }
    if (pointInRect(px, py, getBuyLoungerButtonRect())) {
      buyLounger();
      return;
    }
    if (pointInRect(px, py, getEiswagenButtonRect())) {
      buyEiswagen();
      return;
    }
    if (pointInRect(px, py, getBootsverleihButtonRect())) {
      buyBootsverleih();
      return;
    }
    if (pointInRect(px, py, getPoolButtonRect())) {
      buyPool();
      return;
    }
    if (pointInRect(px, py, getClubhausButtonRect())) {
      buyClubhaus();
      return;
    }
    if (pointInRect(px, py, getStrandbarButtonRect())) {
      buyStrandbar();
      return;
    }
  }

  // Steuerkreis greifen
  if (!stick.aktiv && stickGreifen(px, py)) {
    stick.aktiv = true;
    stick.pointerId = e.pointerId;
    stickSetzen(px, py);
    return;
  }

  // Alles Übrige ist eine Geste im Strand: Wischen dreht den Blick,
  // kurzes Tippen wählt eine Liege oder schickt die Figur los.
  blickGeste = { id: e.pointerId, x0: px, y0: py, blick0: player.blick, neigung0: player.neigung, gewischt: false };
});

// --- Umsehen durch Wischen (vor allem für die Ich-Perspektive) ---
let blickGeste = null;
const WISCH_SCHWELLE = 10; // ab so vielen Pixeln gilt es als Wischen, nicht als Tippen

hud.addEventListener('pointermove', (e) => {
  if (stick.aktiv && e.pointerId === stick.pointerId) {
    const r = hud.getBoundingClientRect();
    stickSetzen(e.clientX - r.left, e.clientY - r.top);
    return;
  }
  if (!blickGeste || e.pointerId !== blickGeste.id) return;
  const rect = hud.getBoundingClientRect();
  const dx = e.clientX - rect.left - blickGeste.x0;
  const dy = e.clientY - rect.top - blickGeste.y0;
  if (!blickGeste.gewischt && Math.hypot(dx, dy) < WISCH_SCHWELLE) return;
  blickGeste.gewischt = true;
  if (!istEgoSicht()) return; // in der Übersicht steht die Kamera fest
  // nach rechts wischen dreht nach rechts: die Blickrichtung nimmt dabei ab
  player.blick = blickGeste.blick0 - dx * 0.005;
  player.neigung = Math.min(0.5, Math.max(-0.7, blickGeste.neigung0 - dy * 0.003));
  player.targetX = player.x;
  player.targetZ = player.z;
});

hud.addEventListener('pointerup', (e) => {
  if (stick.aktiv && e.pointerId === stick.pointerId) {
    stickLoslassen();
    return;
  }
  if (!blickGeste || e.pointerId !== blickGeste.id) return;
  const geste = blickGeste;
  blickGeste = null;
  if (geste.gewischt) return; // war ein Umsehen, kein Tippen

  const px = geste.x0;
  const py = geste.y0;

  // Liege angetippt: Ausbau-Panel auf. Geht auch bei belegter Liege – bei knapp
  // 20 Sekunden pro Tag ist sonst kaum eine Liege lange genug frei.
  const hit = loungerAtScreen(px, py);
  selectedLounger = hit === -1 || selectedLounger === hit ? null : hit;

  // Figur läuft zum angetippten Punkt im Sand
  const ground = screenToGround(px, py);
  if (!ground) return;
  const b = beachBounds();
  player.targetX = Math.min(Math.max(ground.x, b.xMin), b.xMax);
  player.targetZ = Math.min(Math.max(ground.z, b.zMin), b.zMax);
});

function gesteAbbrechen(e) {
  if (stick.aktiv && e.pointerId === stick.pointerId) stickLoslassen();
  if (blickGeste && e.pointerId === blickGeste.id) blickGeste = null;
}
hud.addEventListener('pointercancel', gesteAbbrechen);
hud.addEventListener('pointerleave', gesteAbbrechen);

// --- Spielschleife ---
let lastFrame = performance.now();
let zeitMs = 0; // laufende Zeit für Brandung und andere Bewegung

function update(now) {
  const dt = Math.min(now - lastFrame, 100); // nach einem Tabwechsel keine Riesensprünge
  lastFrame = now;
  zeitMs = now;

  checkDayEnd();

  if (!dayEnded) {
    updateGastAnreise(dt, now);
    updatePlayer(dt);
    checkInNearbyCustomers();
    cleanNearbyLoungers();
    if (state.staff > 0) updateLiegeStaff(dt);
    updateEisWuensche(now);
    if (hatEiswagen()) updateEismann(dt);
    updateBootsverleih(dt, now);
    updatePool(now);
    updateBar(dt, now);
  }

  // Heimweg auch am Season-Ende zu Ende laufen lassen, sonst stehen alle mitten im Sand
  updateAbreise(dt);

  popups = popups.filter((p) => {
    p.rise += dt * 0.0012;
    p.life -= dt / 900;
    return p.life > 0;
  });

  if (dayBanner) {
    dayBanner.life -= dt / 2500; // gut zwei Sekunden sichtbar
    if (dayBanner.life <= 0) dayBanner = null;
  }
}

// --- 3D-Bild zeichnen ---
function drawScene() {
  updateCamera();
  const sky = getSkyColor();
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  gl.clearColor(sky[0], sky[1], sky[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.useProgram(program);
  gl.uniform3fv(uniLightDir, getSunDirection());
  gl.uniform3fv(uniLightColor, getLightColor());
  gl.uniform1f(uniAmbient, 0.5);

  drawBeach();
  for (let i = 0; i < loungers.length; i++) drawLounger(i);
  if (hatEiswagen()) {
    drawEiswagen();
    eismaenner.forEach((e) => {
      if (e.gesetzt) drawPerson(e.x, e.z, COL.eismannShirt, e.blick, e.schritt);
    });
  }
  if (state.pool) drawPool();
  if (state.clubhaus) drawClubhaus();
  if (state.bar) drawStrandbar();
  if (hatBootsverleih()) {
    drawBootsverleih();
    bootFlotte.forEach((b) => { if (b.aktiv) drawBoot(b); });
  }
  // Gäste auf dem Weg: zur Liege, zur Bar und zurück, und abends nach Hause
  loungers.forEach((l) => {
    const f = l.anreise || l.barLaeufer;
    if (f) drawPerson(f.x, f.z, COL.gastShirt, f.blick, f.schritt);
  });
  abreisende.forEach((a) => drawPerson(a.x, a.z, COL.gastShirt, a.blick, a.schritt));
  // In der Ich-Perspektive steckt die Kamera im Kopf – die eigene Figur bliebe im Weg
  if (!istEgoSicht()) drawPerson(player.x, player.z, COL.spielerShirt, player.blick, player.schritt);
  liegeStaffs.forEach((s) => {
    if (s.gesetzt) drawPerson(s.x, s.z, COL.personalShirt, s.blick, s.schritt);
  });
}

// Setzt die Schrift so, dass der Text in die Kachel passt: erst die Wunschgröße,
// dann Schritt für Schritt kleiner. Ohne das ragen längere Titel wie
// "Bootsverleih" auf schmalen Bildschirmen über den Kachelrand hinaus.
function setzeSchriftPassend(text, maxBreite, wunsch, kleinste, fett) {
  const stil = fett ? 'bold ' : '';
  for (let size = Math.round(wunsch); size > kleinste; size--) {
    ctx.font = `${stil}${size}px sans-serif`;
    if (ctx.measureText(text).width <= maxBreite) return;
  }
  ctx.font = `${stil}${kleinste}px sans-serif`;
}

// Eine Kachel der Bedienleiste: Titel, aktueller Stand, Hinweis darunter
function drawShopButton(rect, titel, info) {
  const bezahlbar = !info.voll && state.money >= info.preis;
  ctx.fillStyle = info.voll ? '#2f5d3a' : bezahlbar ? '#1c3d54' : '#16293a';
  ctx.beginPath();
  ctx.roundRect(rect.x, rect.y, rect.w, rect.h, 10);
  ctx.fill();

  const mitte = rect.x + rect.w / 2;
  const platz = rect.w - 10;
  ctx.textAlign = 'center';
  ctx.fillStyle = info.voll || bezahlbar ? '#ffffff' : 'rgba(255, 255, 255, 0.45)';
  setzeSchriftPassend(titel, platz, Math.min(17, rect.w * 0.115), 10, true);
  ctx.fillText(titel, mitte, rect.y + rect.h * 0.33);
  setzeSchriftPassend(info.stand, platz, Math.min(15, rect.w * 0.1), 9, false);
  ctx.fillText(info.stand, mitte, rect.y + rect.h * 0.62);
  ctx.fillStyle = info.voll || bezahlbar ? 'rgba(255, 255, 255, 0.7)' : 'rgba(255, 255, 255, 0.32)';
  setzeSchriftPassend(info.hinweis, platz, Math.min(12, rect.w * 0.08), 8, false);
  ctx.fillText(info.hinweis, mitte, rect.y + rect.h * 0.87);
}

// --- Bedienebene zeichnen ---
function drawHud() {
  ctx.clearRect(0, 0, hud.width, hud.height);
  const top = getTopBarRect();

  // Kopfzeile
  ctx.fillStyle = 'rgba(10, 30, 45, 0.55)';
  ctx.fillRect(top.x, top.y, top.w, top.h);

  ctx.fillStyle = '#ffffff';
  // Datum, Uhr und Geld teilen sich eine Zeile: auf schmalen Bildschirmen
  // muss die Schrift kleiner werden, sonst laufen die drei ineinander
  const kopfGross = schmalerBildschirm() ? 13 : 18;
  const kopfGeld = schmalerBildschirm() ? 16 : 22;
  const moneyRight = getViewButtonRect().x - 12;

  const dateText = `Season ${state.season} · ${getDateLabel(state.day)}`;
  setzeSchriftPassend(dateText, moneyRight * 0.44, kopfGross, 10, true);
  ctx.textAlign = 'left';
  ctx.fillText(dateText, 12, top.h / 2 + 6);
  const dateEnd = 12 + ctx.measureText(dateText).width;

  const moneyText = `💰 ${state.money}€`;
  setzeSchriftPassend(moneyText, moneyRight * 0.36, kopfGeld, 12, true);
  ctx.textAlign = 'right';
  ctx.fillText(moneyText, moneyRight, top.h / 2 + 7);
  const moneyLeft = moneyRight - ctx.measureText(moneyText).width;

  setzeSchriftPassend(`🕗 ${getClockLabel()}`, moneyLeft - dateEnd - 12, kopfGross, 10, true);
  ctx.textAlign = 'center';
  ctx.fillText(`🕗 ${getClockLabel()}`, (dateEnd + moneyLeft) / 2, top.h / 2 + 6);

  // Preisschild über jeder Liege mit wartendem Gast.
  // Hintere Reihen zuerst, damit vordere Schilder oben liegen.
  const schilder = [];
  loungers.forEach((l, i) => {
    if (!l.waiting && !l.willEis && !l.willBoot && !l.willPool && !l.willBar) return;
    const w = loungerWorld(i);
    const p = worldToScreen(w.x, 1.15, w.z + 0.9);
    const text = l.waiting
      ? `${loungerPrice(i)}€`
      : l.willEis
      ? '🍦'
      : l.willBoot
      ? '🚤'
      : l.willPool
      ? '🏊'
      : '🍹';
    if (p) schilder.push({ p, text });
  });
  schilder.sort((a, b) => a.p.y - b.p.y);
  ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'center';
  schilder.forEach(({ p, text }) => {
    const bw = ctx.measureText(text).width + 14;
    ctx.fillStyle = 'rgba(10, 30, 45, 0.78)';
    ctx.beginPath();
    ctx.roundRect(p.x - bw / 2, p.y - 20, bw, 20, 6);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(text, p.x, p.y - 6);
  });

  // Fliegende Texte
  popups.forEach((p) => {
    const s = worldToScreen(p.x, p.y + p.rise, p.z);
    if (!s) return;
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffffff';
    ctx.strokeText(p.text, s.x, s.y);
    ctx.fillStyle = '#12324a';
    ctx.fillText(p.text, s.x, s.y);
    ctx.globalAlpha = 1;
  });

  // Bedienleiste
  const shop = getShopRect();
  ctx.fillStyle = '#12324a';
  ctx.fillRect(shop.x, shop.y, shop.w, shop.h);

  // Steuerkreis: äußerer Ring plus Knopf, der dem Finger folgt
  const s = getStickRect();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.14)';
  ctx.beginPath();
  ctx.arc(s.cx, s.cy, s.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Pfeilandeutung in vier Richtungen, solange der Kreis unberührt ist
  if (!stick.aktiv) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.font = `${Math.max(11, s.radius * 0.22)}px sans-serif`;
    ctx.textAlign = 'center';
    const r = s.radius * 0.7;
    ctx.fillText('▲', s.cx, s.cy - r + 5);
    ctx.fillText('▼', s.cx, s.cy + r + 5);
    ctx.fillText('◀', s.cx - r, s.cy + 5);
    ctx.fillText('▶', s.cx + r, s.cy + 5);
  }

  const knopfR = s.radius * 0.42;
  const kx = s.cx + stick.x * (s.radius - knopfR);
  const ky = s.cy + stick.y * (s.radius - knopfR);
  ctx.fillStyle = stick.aktiv ? 'rgba(255, 255, 255, 0.92)' : 'rgba(255, 255, 255, 0.55)';
  ctx.beginPath();
  ctx.arc(kx, ky, knopfR, 0, Math.PI * 2);
  ctx.fill();

  if (selectedLounger !== null) {
    const u = state.loungerUpgrades[selectedLounger];
    UPGRADE_KEYS.forEach((kind) => {
      const btn = getUpgradeButtonRect(kind);
      const owned = u[kind];
      const affordable = state.money >= UPGRADES[kind].cost;
      ctx.fillStyle = owned ? '#2f5d3a' : affordable ? '#1c3d54' : '#16293a';
      ctx.beginPath();
      ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 10);
      ctx.fill();
      ctx.fillStyle = owned || affordable ? '#ffffff' : 'rgba(255, 255, 255, 0.45)';
      const titel = `${UPGRADES[kind].icon} ${UPGRADES[kind].name}`;
      const unten = owned
        ? `✓ +${UPGRADES[kind].bonus}€/Buchung`
        : `${UPGRADES[kind].cost}€ · +${UPGRADES[kind].bonus}€/Buchung`;
      setzeSchriftPassend(titel, btn.w - 10, Math.min(16, btn.w * 0.1), 10, true);
      ctx.fillText(titel, btn.x + btn.w / 2, btn.y + btn.h * 0.44);
      setzeSchriftPassend(unten, btn.w - 10, Math.min(13, btn.w * 0.075), 8, false);
      ctx.fillText(unten, btn.x + btn.w / 2, btn.y + btn.h * 0.75);
    });

    const closeBtn = getUpgradeButtonRect('close');
    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.beginPath();
    ctx.roundRect(closeBtn.x, closeBtn.y, closeBtn.w, closeBtn.h, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    const liegeTitel = `Liege ${selectedLounger + 1}`;
    const liegeInfo = `✕ Fertig · ${loungerPrice(selectedLounger)}€/Tag`;
    setzeSchriftPassend(liegeTitel, closeBtn.w - 10, Math.min(16, closeBtn.w * 0.1), 10, true);
    ctx.fillText(liegeTitel, closeBtn.x + closeBtn.w / 2, closeBtn.y + closeBtn.h * 0.44);
    setzeSchriftPassend(liegeInfo, closeBtn.w - 10, Math.min(13, closeBtn.w * 0.075), 8, false);
    ctx.fillText(liegeInfo, closeBtn.x + closeBtn.w / 2, closeBtn.y + closeBtn.h * 0.75);
  } else {
    // Sechs Kacheln: Titel, darunter der Stand, darunter der nächste Preis
    drawShopButton(getPersonalButtonRect(), '👷 Personal', {
      voll: state.staff >= MAX_STAFF,
      preis: nextStaffCost(),
      stand: state.staff === 0 ? `${nextStaffCost()}€` : `${state.staff} im Dienst`,
      hinweis:
        state.staff >= MAX_STAFF
          ? `alle ${MAX_STAFF} eingestellt`
          : state.staff === 0
          ? 'nimmt dir Arbeit ab'
          : `nächster: ${nextStaffCost()}€`,
    });

    drawShopButton(getBuyLoungerButtonRect(), '🛏️ Neue Liege', {
      voll: beachIsFull(),
      preis: nextLoungerCost(),
      stand: beachIsFull() ? 'Strand voll' : `${nextLoungerCost()}€`,
      hinweis: `${loungers.length} von ${MAX_LOUNGER_COUNT} Liegen`,
    });

    drawShopButton(getEiswagenButtonRect(), '🍦 Eiswagen', {
      voll: state.eismaenner >= MAX_EISMAENNER,
      preis: nextEismannCost(),
      stand:
        state.eismaenner === 0
          ? `${EISWAGEN_COST}€`
          : `${state.eismaenner} ${state.eismaenner === 1 ? 'Eismann' : 'Eismänner'}`,
      hinweis:
        state.eismaenner >= MAX_EISMAENNER
          ? `alle ${MAX_EISMAENNER} · ${EIS_PREIS}€/Eis`
          : state.eismaenner === 0
          ? `Eismann inkl. · ${EIS_PREIS}€/Eis`
          : `nächster: ${nextEismannCost()}€`,
    });

    drawShopButton(getBootsverleihButtonRect(), '🚤 Bootsverleih', {
      voll: state.boote >= MAX_BOOTE,
      preis: nextBootCost(),
      stand:
        state.boote === 0
          ? `${BOOTSVERLEIH_COST}€`
          : `${bootFlotte.filter((b) => b.aktiv).length}/${state.boote} unterwegs`,
      hinweis:
        state.boote >= MAX_BOOTE
          ? `alle ${MAX_BOOTE} Boote · ${BOOT_PREIS}€`
          : state.boote === 0
          ? `${BOOT_START} Boote · ${BOOT_PREIS}€/Fahrt`
          : `weiteres Boot: ${nextBootCost()}€`,
    });

    drawShopButton(getPoolButtonRect(), '🏊 Pool', {
      voll: state.pool,
      preis: POOL_COST,
      stand: state.pool
        ? `${loungers.filter((l) => l.imPool).length}/${POOL_KAPAZITAET} im Wasser`
        : `${POOL_COST}€`,
      hinweis: state.pool ? `${POOL_PREIS}€ pro Bad` : `Eintritt ${POOL_PREIS}€ pro Gast`,
    });

    drawShopButton(getClubhausButtonRect(), '🏛️ Clubhaus', {
      voll: state.clubhaus,
      preis: CLUBHAUS_COST,
      stand: state.clubhaus ? `+${CLUBHAUS_BONUS}€ je Liege` : `${CLUBHAUS_COST}€`,
      hinweis: state.clubhaus ? 'gehobener Strand' : `alle Liegen +${CLUBHAUS_BONUS}€/Tag`,
    });

    drawShopButton(getStrandbarButtonRect(), '🍹 Strandbar', {
      voll: state.bar,
      preis: STRANDBAR_COST,
      stand: state.bar
        ? `${loungers.filter((l) => l.barPhase === 'sitzt').length}/${BAR_HOCKER} am Tresen`
        : `${STRANDBAR_COST}€`,
      hinweis: state.bar ? `${GETRAENK_PREIS}€ pro Getränk` : `Gäste zahlen ${GETRAENK_PREIS}€ je Glas`,
    });
  }

  // Ich-Perspektive: Fadenkreuz und was gerade davor liegt
  if (istEgoSicht() && !dayEnded) {
    const mx = hud.width / 2;
    const my = (top.h + (hud.height - shop.h)) / 2; // Bildmitte des sichtbaren Streifens
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(mx, my, 4, 0, Math.PI * 2);
    ctx.stroke();

    const ziel = loungerAtScreen(mx, my);
    if (ziel !== -1) {
      const w = loungerWorld(ziel);
      if (Math.hypot(player.x - w.x, player.z - w.z) < 8) {
        const l = loungers[ziel];
        const zustand = l.dirty
          ? '🗑️ muss aufgeräumt werden'
          : l.waiting
          ? `🧍 Gast wartet · ${loungerPrice(ziel)}€`
          : l.willEis
          ? `🍦 Gast möchte ein Eis · ${EIS_PREIS}€`
          : l.willBoot
          ? `🚤 Gast möchte aufs Wasser · ${BOOT_PREIS}€`
          : l.willPool
          ? `🏊 Gast möchte schwimmen · ${POOL_PREIS}€`
          : l.willBar
          ? `🍹 Gast hat Durst · ${GETRAENK_PREIS}€`
          : l.aufSee
          ? '🚤 Gast ist mit dem Boot draußen'
          : l.imPool
          ? '🏊 Gast ist im Pool'
          : l.barPhase
          ? '🍹 Gast ist an der Bar'
          : l.anreise
          ? '🚶 Gast ist auf dem Weg hierher'
          : l.booked
          ? `😎 belegt · ${loungerPrice(ziel)}€/Tag`
          : `frei · ${loungerPrice(ziel)}€/Tag`;
        const titel = `Liege ${ziel + 1}`;
        ctx.font = 'bold 15px sans-serif';
        const bw = Math.max(ctx.measureText(titel).width, 0) + 24;
        ctx.font = '13px sans-serif';
        const bw2 = Math.max(bw, ctx.measureText(zustand).width + 24);
        ctx.fillStyle = 'rgba(10, 30, 45, 0.72)';
        ctx.beginPath();
        ctx.roundRect(mx - bw2 / 2, my + 16, bw2, 46, 8);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText(titel, mx, my + 35);
        ctx.font = '13px sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillText(zustand, mx, my + 54);
      }
    }
  }

  // Kurze Tagesabrechnung
  if (dayBanner) {
    ctx.globalAlpha = Math.min(1, dayBanner.life * 2.5);
    ctx.font = 'bold 19px sans-serif';
    ctx.textAlign = 'center';
    const bw = ctx.measureText(dayBanner.text).width + 36;
    const by = top.h + 10;
    ctx.fillStyle = 'rgba(18, 50, 74, 0.85)';
    ctx.beginPath();
    ctx.roundRect(hud.width / 2 - bw / 2, by, bw, 38, 10);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(dayBanner.text, hud.width / 2, by + 25);
    ctx.globalAlpha = 1;
  }

  // Sicht umschalten und Neu starten
  const viewBtn = getViewButtonRect();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.beginPath();
  ctx.roundRect(viewBtn.x, viewBtn.y, viewBtn.w, viewBtn.h, 8);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  const sichtSymbol = istEgoSicht() ? '🛰' : '👁';
  ctx.fillText(
    schmalerBildschirm() ? sichtSymbol : `${sichtSymbol} ${istEgoSicht() ? 'Übersicht' : 'Ich-Sicht'}`,
    viewBtn.x + viewBtn.w / 2,
    viewBtn.y + viewBtn.h / 2 + 5
  );

  const resetBtn = getResetButtonRect();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.beginPath();
  ctx.roundRect(resetBtn.x, resetBtn.y, resetBtn.w, resetBtn.h, 8);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillText(
    schmalerBildschirm() ? '🔄' : '🔄 Neu starten',
    resetBtn.x + resetBtn.w / 2,
    resetBtn.y + resetBtn.h / 2 + 5
  );

  // Season-Abrechnung
  if (dayEnded) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
    ctx.fillRect(0, 0, hud.width, hud.height);
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 34px sans-serif';
    ctx.fillText(`🏖️ Season ${state.season} beendet!`, hud.width / 2, hud.height / 2 - 40);
    ctx.font = '22px sans-serif';
    ctx.fillText(`Heute verdient: ${state.money - dayEarningsBase}€`, hud.width / 2, hud.height / 2);
    ctx.fillText(`Diese Season verdient: ${state.money - state.seasonStartMoney}€`, hud.width / 2, hud.height / 2 + 30);

    const nextBtn = getNextDayButtonRect();
    ctx.fillStyle = '#2f5d3a';
    ctx.beginPath();
    ctx.roundRect(nextBtn.x, nextBtn.y, nextBtn.w, nextBtn.h, 12);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 17px sans-serif';
    ctx.fillText('▶ Neue Season starten (Juni)', nextBtn.x + nextBtn.w / 2, nextBtn.y + nextBtn.h / 2 + 7);
  }
}

function loop(now) {
  update(now);
  drawScene();
  drawHud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
  </script>
</body>
</html>
